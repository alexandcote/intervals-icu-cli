name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test the built CLI
        run: |
          node dist/index.js --help
          node dist/index.js llms > /dev/null
      - name: Pack the npm artifact
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - name: Switch to the minimum supported Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Smoke test the installed npm artifact on Node.js 18
        run: |
          npm install --global "$RUNNER_TEMP"/package/intervals-icu-cli-*.tgz
          intervals --version
          intervals --help > /dev/null
          intervals llms > /dev/null
